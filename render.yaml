services:
  - type: web
    name: musicdl-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: MUSICDL_SEARCH_SIZE
        value: "8"
      - key: MUSICDL_SOURCE_TIMEOUT
        value: "35"
