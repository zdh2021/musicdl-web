<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="音乐" />
  <title>音乐 · musicdl</title>
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="app-title">音乐</h1>
        <span class="badge" id="status-badge">就绪</span>
      </div>
      <div class="topbar-actions">
        <button type="button" id="btn-sources" class="icon-btn" title="音源" aria-label="音源">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        </button>
        <button type="button" id="btn-files" class="icon-btn" title="已下载" aria-label="已下载">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
      </div>
    </header>

    <section class="search-bar">
      <form id="search-form" class="search-form">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="搜索歌名 / 歌手" enterkeyhint="search" autocomplete="off" required />
        <button type="submit" id="btn-search" class="search-go">搜</button>
      </form>
    </section>

    <section class="meta-bar" id="meta-bar" hidden>
      <span id="meta-text"></span>
      <div class="source-chips" id="source-chips"></div>
    </section>

    <div class="toolbar" id="toolbar" hidden>
      <label class="chk"><input type="checkbox" id="sel-all" /> 全选</label>
      <button type="button" id="btn-dl-selected" class="text-btn" disabled>下载所选</button>
      <span id="result-count" class="muted"></span>
    </div>

    <main id="results" class="results empty">
      <div class="empty-state">
        <div class="empty-icon">♪</div>
        <p>搜索并播放喜欢的歌</p>
      </div>
    </main>
  </div>

  <!-- 底部迷你播放条 -->
  <footer class="now-bar" id="now-bar" hidden>
    <div class="progress-track" id="progress-track" title="进度">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="now-inner">
      <button type="button" class="now-cover-btn" id="btn-expand" aria-label="展开播放器">
        <img id="cover-mini" alt="" hidden />
        <span id="cover-mini-ph" class="cover-mini-ph">♪</span>
      </button>
      <button type="button" class="now-info" id="btn-expand-info" aria-label="展开播放器">
        <div class="now-title" id="now-title">未选择曲目</div>
        <div class="now-artist" id="now-artist">—</div>
      </button>
      <button type="button" class="ctrl-btn" id="btn-play" aria-label="播放/暂停" disabled>
        <svg class="ic-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg class="ic-pause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
      </button>
      <button type="button" class="ctrl-btn subtle" id="btn-dl-now" aria-label="下载" disabled>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
    </div>
    <div class="time-row">
      <span id="time-cur">0:00</span>
      <span id="time-dur">0:00</span>
    </div>
  </footer>

  <!-- 全屏播放页 -->
  <div class="player-sheet" id="player-sheet" hidden>
    <div class="sheet-bg" id="sheet-bg"></div>
    <button type="button" class="sheet-close" id="btn-collapse" aria-label="收起">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="sheet-body">
      <div class="sheet-cover-wrap">
        <img id="cover" alt="" hidden />
        <div id="cover-ph" class="sheet-cover-ph">♪</div>
      </div>
      <h2 id="sheet-title">未选择曲目</h2>
      <p id="sheet-artist" class="muted">—</p>
      <div class="sheet-progress">
        <div class="progress-track big" id="progress-track-big">
          <div class="progress-fill" id="progress-fill-big"></div>
        </div>
        <div class="time-row">
          <span id="time-cur-big">0:00</span>
          <span id="time-dur-big">0:00</span>
        </div>
      </div>
      <div class="sheet-controls">
        <button type="button" class="ctrl-btn lg" id="btn-play-big" aria-label="播放/暂停" disabled>
          <svg class="ic-play" width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg class="ic-pause" width="40" height="40" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
        </button>
        <button type="button" class="ctrl-btn" id="btn-dl-sheet" aria-label="下载" disabled>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
      </div>
      <pre id="lyric" class="lyric muted"></pre>
      <div id="dl-status" class="dl-status"></div>
    </div>
  </div>

  <audio id="audio" preload="none"></audio>

  <!-- 音源面板 -->
  <dialog id="sources-dialog">
    <form method="dialog" class="dlg-head">
      <h3>音源</h3>
      <button value="close" class="ghost">完成</button>
    </form>
    <div class="sources" id="sources"></div>
    <p class="hint">默认勾选免费源；国内平台可按需勾选。仅供个人学习，请尊重版权。</p>
  </dialog>

  <dialog id="files-dialog">
    <form method="dialog" class="dlg-head">
      <h3>已下载</h3>
      <button value="close" class="ghost">关闭</button>
    </form>
    <p class="muted small" id="files-dir"></p>
    <ul id="files-list" class="files-list"></ul>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
